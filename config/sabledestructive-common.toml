#Sable: Destructive common settings
[general]
	enabled = false
	effects = true
	fancyVanishEffect = true
	allowDetach = true
	handleExplosions = true
	affectOnlySubLevelBlocks = false

[impact]
	#Prevents soft materials from breaking tougher materials by mass alone.
	hardnessGate = true
	selfDamage = true
	allowLayerPenetration = false
	# Default: 3.6
	# Range: 0.5 ~ 40.0
	deadzoneSpeed = 3.6
	# Default: 4.2
	# Range: 0.5 ~ 80.0
	minimumBreakSpeed = 4.2
	# Default: 1.45
	# Range: 0.25 ~ 4.0
	collisionStrength = 1.45
	# Default: 0.06
	# Range: 0.05 ~ 1.0
	attackerToughnessRatio = 0.06
	# Default: 24.0
	# Range: 1.0 ~ 64.0
	massLeverageLimit = 24.0
	# Default: 2
	# Range: 0 ~ 2
	penetrationMaxBlocks = 2
	# Default: 96
	# Range: 8 ~ 512
	breaksPerTick = 96

[detach]
	#Off means one damaged block becomes one detached body.
	clusterDetach = false
	# Default: 0.34
	# Range: 0.0 ~ 1.0
	chance = 0.34
	# Default: 18
	# Range: 1 ~ 120
	maxPerSecond = 18
	# Default: 12
	# Range: 1 ~ 128
	clusterMaxBlocks = 12

[shockwave]
	enabled = true
	fallingDust = true
	# Default: 14.0
	# Range: 2.0 ~ 80.0
	minimumImpactSpeed = 14.0
	# Default: 20.0
	# Range: 2.0 ~ 48.0
	maximumEpicRadius = 20.0
	# Default: 0.24
	# Range: 0.05 ~ 0.8
	craterDepthFactor = 0.24
	# Default: 1.1
	# Range: 0.2 ~ 3.0
	knockbackScale = 1.1
	epicImpactFx = true
	cameraShake = true
	# Default: 1.0
	# Range: 0.0 ~ 2.0
	cameraShakeStrength = 1.0
	# Default: 1.0
	# Range: 0.25 ~ 2.0
	impactFxScale = 1.0
